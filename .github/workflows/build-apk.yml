name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create index.html for Vite (Lovable fix)
        run: |
          # Если index.html отсутствует или пустой, создаем его для корректной сборки Vite
          if [ ! -f "index.html" ] || ! grep -q "root" index.html; then
            echo "Creating standard Vite index.html for Lovable project..."
            cat << 'EOF' > index.html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectral Choice Hollow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
EOF
          fi

      - name: Build Web App (Vite)
        run: |
          # Запускаем сборку Vite, которая сгенерирует папку dist из компонентов src
          npm run build || npx vite build

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.spectral.hollow",
            "appName": "Spectral Choice Hollow",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }' > capacitor.config.json

      - name: Install Capacitor Core & CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Add and Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Choice-Hollow-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
