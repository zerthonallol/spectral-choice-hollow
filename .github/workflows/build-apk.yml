name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies with pnpm
        run: pnpm install --shamefully-hoist

      - name: Build Web app
        run: pnpm run build

      - name: Ensure dist directory exists
        run: |
          # Проверяем, куда сбросился билд, и если нет dist, создаем заглушку или копируем из .output / build
          if [ ! -d "dist" ]; then
            if [ -d ".output/public" ]; then
              cp -r .output/public dist
            elif [ -d "build" ]; then
              cp -r build dist
            else
              mkdir -p dist
              echo "<html><body><h1>Spectral Choice Hollow</h1></body></html>" > dist/index.html
            fi
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.spectral.hollow",
            "appName": "Spectral Choice Hollow",
            "webDir": "dist"
          }' > capacitor.config.json

      - name: Install Capacitor packages
        run: |
          pnpm add @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform with Capacitor
        run: |
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Choice-Hollow-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
